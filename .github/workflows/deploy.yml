name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          echo "Deploying Portfolio to Oracle VM..."
          docker compose build
          docker compose up -d
          echo "Deployment Successful!"
